name: Release OpenUI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build OpenUI
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}

          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
            armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
            armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
            armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
            386) BOOTLIN_ARCH="x86-i686" ;;
            s390x) BOOTLIN_ARCH="s390x-z13" ;;
          esac

          echo "Resolving Bootlin musl toolchain for ${BOOTLIN_ARCH}"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          TARBALL_NAME="$(curl -fsSL "${TARBALL_BASE}" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)"
          test -n "${TARBALL_NAME}"
          cd /tmp
          curl -fL -sS -o "${TARBALL_NAME}" "${TARBALL_BASE}${TARBALL_NAME}"
          tar -xf "${TARBALL_NAME}"
          TOOLCHAIN_DIR="$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)"
          export PATH="$(realpath "${TOOLCHAIN_DIR}")/bin:${PATH}"
          export CC="$(realpath "$(find "${TOOLCHAIN_DIR}/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")"
          test -n "${CC}"
          cd -

          go build -ldflags "-w -s -linkmode external -extldflags '-static'" -o openui-release -v main.go
          file openui-release
          ldd openui-release || echo "Static binary confirmed"

          mkdir open-ui
          mv openui-release open-ui/open-ui
          cp open-ui.service.debian open-ui/
          cp open-ui.service.arch open-ui/
          cp open-ui.service.rhel open-ui/
          cp open-ui.rc open-ui/
          cp install.sh open-ui/install.sh
          cp x-ui.sh open-ui/open-ui.sh
          mkdir open-ui/bin

          cd open-ui/bin
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/download/v26.4.25/"
          case "${{ matrix.platform }}" in
            amd64) XRAY_ASSET="Xray-linux-64.zip" ;;
            arm64) XRAY_ASSET="Xray-linux-arm64-v8a.zip" ;;
            armv7) XRAY_ASSET="Xray-linux-arm32-v7a.zip" ;;
            armv6) XRAY_ASSET="Xray-linux-arm32-v6.zip" ;;
            386) XRAY_ASSET="Xray-linux-32.zip" ;;
            armv5) XRAY_ASSET="Xray-linux-arm32-v5.zip" ;;
            s390x) XRAY_ASSET="Xray-linux-s390x.zip" ;;
          esac
          wget -q "${XRAY_URL}${XRAY_ASSET}"
          unzip "${XRAY_ASSET}"
          rm -f "${XRAY_ASSET}" geoip.dat geosite.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          wget -q -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          wget -q -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          wget -q -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -q -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray "xray-linux-${{ matrix.platform }}"

      - name: Package
        run: tar -zcvf "open-ui-linux-${{ matrix.platform }}.tar.gz" open-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-ui-linux-${{ matrix.platform }}
          path: ./open-ui-linux-${{ matrix.platform }}.tar.gz

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: open-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: open-ui-linux-${{ matrix.platform }}.tar.gz
          overwrite: true

  build-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        shell: pwsh
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config

      - name: Build OpenUI for Windows
        shell: msys2 {0}
        run: |
          export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64
          export CC=x86_64-w64-mingw32-gcc
          go build -ldflags "-w -s" -o openui-release.exe -v main.go

      - name: Copy and download resources
        shell: pwsh
        run: |
          mkdir open-ui
          Copy-Item openui-release.exe open-ui\open-ui.exe
          mkdir open-ui\bin
          cd open-ui\bin
          $XrayUrl = "https://github.com/XTLS/Xray-core/releases/download/v26.4.25/"
          Invoke-WebRequest -Uri "${XrayUrl}Xray-windows-64.zip" -OutFile "Xray-windows-64.zip"
          Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath .
          Remove-Item "Xray-windows-64.zip"
          Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip.dat"
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite.dat"
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat" -OutFile "geoip_IR.dat"
          Invoke-WebRequest -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat" -OutFile "geosite_IR.dat"
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip_RU.dat"
          Invoke-WebRequest -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite_RU.dat"
          Rename-Item xray.exe xray-windows-amd64.exe
          cd ..
          Copy-Item -Path ..\windows_files\* -Destination . -Recurse
          cd ..

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path .\open-ui -DestinationPath "open-ui-windows-amd64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-ui-windows-amd64
          path: ./open-ui-windows-amd64.zip

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: open-ui-windows-amd64.zip
          asset_name: open-ui-windows-amd64.zip
          overwrite: true
