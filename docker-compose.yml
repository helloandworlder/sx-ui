services:
  openui:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: openui_app
    # hostname: yourhostname <- optional
    volumes:
      - $PWD/db/:/etc/open-ui/
      - $PWD/cert/:/root/cert/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      OPENUI_ENABLE_FAIL2BAN: "true"
      OPENUI_DB_FOLDER: "/etc/open-ui"
      OPENUI_LOG_FOLDER: "/var/log/open-ui"
      OPENUI_BIN_FOLDER: "/app/bin"
    tty: true
    network_mode: host
    restart: unless-stopped
